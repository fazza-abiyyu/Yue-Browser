<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Locker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-container">
        <div class="app-logo">
          <img src="image.png" alt="Logo" style="width: 100%; height: 100%; object-fit: cover; border-radius: inherit;">
        </div>
        <div>
          <h1 class="app-title">Web Locker</h1>
          <p class="app-tagline">Secure your browsing</p>
        </div>
      </div>
    </header>

    <!-- Initial PIN Setup View (shown only if PIN is not configured yet) -->
    <div id="setup-view" class="view hidden">
      <div class="card setup-card">
        <h2 class="section-title">Buat PIN Keamanan</h2>
        <p class="section-desc">Atur PIN 6 angka untuk mengunci dan membuka website Anda.</p>
        <div class="setup-pin-display">
          <input type="password" id="setup-pin" maxlength="6" placeholder="••••••" autocomplete="off">
        </div>
        <div class="setup-pin-display">
          <input type="password" id="setup-pin-confirm" maxlength="6" placeholder="Konfirmasi PIN" autocomplete="off">
        </div>
        <button id="save-initial-pin-btn" class="primary-btn">Simpan PIN</button>
        <p id="setup-error" class="error-text hidden"></p>
      </div>
    </div>

    <!-- Main Dashboard View -->
    <div id="main-view" class="view">
      <!-- Tabs Navigation -->
      <nav class="tab-nav">
        <button class="tab-btn active" data-tab="status-tab">Status</button>
        <button class="tab-btn" data-tab="sites-tab">Daftar</button>
        <button class="tab-btn" data-tab="settings-tab">Pengaturan</button>
      </nav>

      <!-- Status Tab -->
      <div id="status-tab" class="tab-content active">
        <div class="card status-card">
          <p class="current-site-label">Website Saat Ini</p>
          <p id="current-hostname" class="current-site-val">mengambil data...</p>
          
          <div class="status-toggle-wrapper">
            <div id="status-icon" class="status-icon unlocked">
              <svg viewBox="0 0 24 24" id="lock-icon-svg">
                <!-- Lock Open/Close path will be adjusted by JS -->
              </svg>
            </div>
            <p id="status-text" class="status-text">Terbuka</p>
            <button id="toggle-lock-btn" class="action-toggle-btn">Kunci Website Ini</button>
          </div>
        </div>
      </div>

      <!-- Sites Tab -->
      <div id="sites-tab" class="tab-content">
        <div class="card list-card">
          <h2 class="section-title">Website Terkunci</h2>
          <div class="add-site-form">
            <input type="text" id="new-site-input" placeholder="contoh: facebook.com">
            <button id="add-site-btn" class="icon-btn">
              <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </button>
          </div>
          <ul id="locked-sites-list" class="sites-list">
            <!-- Populated dynamically -->
          </ul>
        </div>
      </div>

      <!-- Settings Tab -->
      <div id="settings-tab" class="tab-content">
        <div class="card settings-card">
          <h2 class="section-title">Ubah PIN Keamanan</h2>
          <div class="form-group">
            <label for="old-pin">PIN Lama</label>
            <input type="password" id="old-pin" maxlength="6" placeholder="••••••">
          </div>
          <div class="form-group">
            <label for="new-pin">PIN Baru</label>
            <input type="password" id="new-pin" maxlength="6" placeholder="••••••">
          </div>
          <div class="form-group">
            <label for="confirm-new-pin">Konfirmasi PIN Baru</label>
            <input type="password" id="confirm-new-pin" maxlength="6" placeholder="••••••">
          </div>
          <button id="change-pin-btn" class="primary-btn">Update PIN</button>
          
          <h2 class="section-title" style="margin-top: 24px;">Waktu Auto Lock (Idle)</h2>
          <div class="form-group">
            <label for="auto-lock-timeout">Kunci otomatis setelah tidak ada aktivitas selama:</label>
            <select id="auto-lock-timeout">
              <option value="0">Seketika (Reload / Tab Baru)</option>
              <option value="1">1 Menit</option>
              <option value="5">5 Menit</option>
              <option value="15">15 Menit</option>
              <option value="30">30 Menit</option>
            </select>
          </div>
          
          <p id="settings-message" class="message-text hidden"></p>
        </div>
      </div>
    </div>

    <!-- Verification Modal -->
    <div id="verify-modal" class="modal-overlay hidden">
      <div class="card modal-card">
        <h3 class="modal-title">Konfirmasi PIN</h3>
        <p class="modal-desc">Masukkan PIN 6 angka untuk melanjutkan tindakan ini.</p>
        <div class="form-group">
          <input type="password" id="confirm-action-pin" maxlength="6" placeholder="••••••" style="text-align: center; font-size: 18px; letter-spacing: 8px;">
        </div>
        <div class="modal-buttons">
          <button id="modal-cancel-btn" class="secondary-btn">Batal</button>
          <button id="modal-confirm-btn" class="primary-btn">Konfirmasi</button>
        </div>
        <p id="modal-error" class="error-text hidden"></p>
      </div>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
